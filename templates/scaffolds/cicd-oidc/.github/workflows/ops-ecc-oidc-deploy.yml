name: Supply-Chain Hardened OIDC CI/CD & SARIF Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  devsecops-gate:
    name: ops-ecc Audit & Trivy Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (SHA pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust & ops-ecc
        uses: dtolnay/rust-toolchain@4be9e26fade6f8fc20fb7fb1c7b909a75f9f2d5e
      - name: Run ops-ecc strict SARIF audit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Auditing PR: $PR_TITLE"
          ops-ecc audit --strict --format sarif --output ops-ecc.sarif

      - name: Upload SARIF report to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@45ab6c2fb7fb2a5ba3eb2fb08d22e6f18636d7c1 # v3.27.5
        with:
          sarif_file: ops-ecc.sarif

      - name: Run Trivy filesystem & container vulnerability scan
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402990b394f2dd8c87dbb0 # 0.28.0
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "1"

  deploy-aws-oidc:
    name: Passwordless AWS OIDC Rolling Deploy
    needs: devsecops-gate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code (SHA pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS Credentials via OIDC Federation
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Trigger zero-downtime ECS rolling deployment
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER_NAME }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE_NAME }}
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --force-new-deployment
