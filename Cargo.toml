[package]
name = "ops-ecc"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
authors = ["Muhammad Bilal Talha <bilal@ops-ecc.dev>"]
description = "Blazing-fast Full-Stack + Heavy DevOps & DevSecOps Agent Harness CLI for Claude Code (.claude/), Gemini CLI (.gemini/), Cursor (.cursorrules), and Universal AGENTS.md"
license = "MIT"
repository = "https://github.com/bilal-talha-dev/ops-ecc"
homepage = "https://github.com/bilal-talha-dev/ops-ecc"
keywords = ["devops", "devsecops", "terraform", "claude-code", "gemini-cli"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[[bin]]
name = "ops-ecc"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
comfy-table = "7.1"
console = "0.15"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
dirs = "5.0"
hcl-rs = "0.18"
ignore = "0.4"
include_dir = "0.7"
once_cell = "1.19"
owo-colors = { version = "4.0", features = ["supports-colors"] }
rayon = "1.10"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
